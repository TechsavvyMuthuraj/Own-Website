    <rect width="78" height="78" rx="20" fill="#0E1015" stroke="#FACC15" stroke-opacity="0.35" stroke-width="2"/>
    <!-- Stylized Geometric N Symbol in Vibrant Electric Gold -->
    <path d="M22 60V22C22 19.2 24.2 17 27 17H31.2C33.8 17 36.2 18.4 37.5 20.6L52.5 45.5V22C52.5 19.2 54.7 17 57.5 17H59C61.8 17 64 19.2 64 22V60C64 62.8 61.8 65 59 65H54.8C52.2 65 49.8 63.6 48.5 61.4L33.5 36.5V60C33.5 62.8 31.3 65 28.5 65H27C24.2 65 22 62.8 22 60Z" fill="url(#n-gold-gradient)"/>
